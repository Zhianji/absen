<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Absensi - Check-in Siswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .topbar .who { font-size: 14px; font-weight: 600; }
  .topbar .who span { color: var(--ink-soft); font-weight: 400; }

  .stage {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 20px 40px;
    text-align: center;
  }

  .clock {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: clamp(40px, 12vw, 64px);
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1;
  }
  .date-line {
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 8px;
    margin-bottom: 36px;
  }

  .mapel-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 420px;
  }
  .mapel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: var(--shadow);
    transition: transform 0.1s ease, border-color 0.15s ease;
  }
  .mapel-name { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .mapel-status { font-size: 12px; color: var(--ink-faint); font-family: var(--font-mono); }

  .checkin-btn {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(46, 92, 230, 0.35);
  }
  .checkin-btn:hover:not(:disabled) { background: var(--primary-dark); }
  .checkin-btn.done {
    background: var(--success-bg);
    color: var(--success);
    box-shadow: none;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .checkin-btn.just-done { animation: pop 0.35s ease; }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-topbar {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    box-shadow: 0 1px 2px rgba(27, 34, 51, 0.03);
    transition: all 0.15s ease;
  }
  .btn-topbar:hover {
    background: var(--primary-bg);
    color: var(--primary);
    border-color: rgba(46, 92, 230, 0.25);
  }
  .btn-topbar.btn-logout:hover {
    background: var(--danger-bg);
    color: var(--danger);
    border-color: rgba(225, 72, 60, 0.25);
  }
  .btn-topbar svg {
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .btn-topbar:hover svg {
    transform: scale(1.08);
  }
  
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal-card {
    background: var(--surface); padding: 24px; border-radius: var(--radius);
    width: 90%; max-width: 320px;
    box-shadow: var(--shadow);
  }
  .modal-card h3 { margin: 0 0 16px 0; font-size: 18px; color: var(--ink); }
  .modal-card input {
    width: 100%; padding: 10px; margin-bottom: 12px;
    border: 1px solid var(--border); border-radius: 6px;
    box-sizing: border-box; font-family: inherit; background: var(--surface);
    color: var(--ink);
  }
  .modal-actions { display: flex; gap: 8px; }
  .modal-btn {
    flex: 1; padding: 10px; border: none; border-radius: 6px;
    font-weight: 600; cursor: pointer; color: #fff;
  }
  .btn-cancel { background: var(--ink-soft); }
  .btn-save { background: var(--primary); }

  /* Tabs */
  .tab-switcher {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab-btn {
    flex: 1;
    padding: 12px 16px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }
  .tab-btn svg { width: 18px; height: 18px; }

  /* Riwayat specific CSS */
  .stage-riwayat {
    padding: 24px 20px 40px;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    box-sizing: border-box;
  }
  .riwayat-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .riwayat-header h2 { margin: 0; font-size: 20px; font-weight: 700; color: var(--ink); }
  .riwayat-header .overall-persen { font-size: 32px; font-weight: 700; margin-top: 8px; }
  .overall-persen.high { color: var(--success); }
  .overall-persen.mid { color: #f59e0b; }
  .overall-persen.low { color: var(--danger); }

  .rekap-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .rekap-stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 8px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
  }
  .stat-value { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .stat-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; font-weight: 600; }
  .stat-hadir .stat-value { color: var(--success); }
  .stat-izin .stat-value { color: var(--primary); }
  .stat-sakit .stat-value { color: #f59e0b; }
  .stat-alfa .stat-value { color: var(--danger); }

  .filter-bar {
    display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
    justify-content: center;
  }
  .filter-bar label { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .filter-bar select {
    padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); font-family: inherit; font-size: 13px;
    color: var(--ink); outline: none;
  }

  .mapel-recap-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;
  }
  @media (max-width: 480px) {
    .mapel-recap-grid { grid-template-columns: 1fr; }
  }
  .mapel-recap-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .mapel-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--ink); text-align: center;}
  .mapel-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .mapel-detail div { font-size: 12px; text-align: center; }
  .mapel-detail div span { display: block; font-weight: 700; font-size: 14px; }
  
  .progress-bar {
    height: 6px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-bottom: 6px;
  }
  .progress-fill { height: 100%; transition: width 0.3s ease; }
  .progress-fill.high { background: var(--success); }
  .progress-fill.mid { background: #f59e0b; }
  .progress-fill.low { background: var(--danger); }
  .persen-label { font-size: 12px; text-align: center; font-weight: 600; }
  .persen-label.high { color: var(--success); }
  .persen-label.mid { color: #f59e0b; }
  .persen-label.low { color: var(--danger); }

  .table-wrap {
    overflow-x: auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 24px;
  }
  .rekap-table { width: 100%; border-collapse: collapse; min-width: 400px; text-align: left; }
  .rekap-table th { background: var(--bg); font-size: 12px; font-weight: 600; color: var(--ink-soft); padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .rekap-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--ink); }
  .rekap-table tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .badge-hadir { background: var(--success-bg); color: var(--success); }
  .badge-izin { background: var(--primary-bg); color: var(--primary); }
  .badge-sakit { background: #fef3c7; color: #d97706; }
  .badge-alfa { background: var(--danger-bg); color: var(--danger); }

  .month-cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px;
  }
  .month-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; cursor: pointer; transition: all 0.2s ease;
  }
  .month-card:hover { border-color: var(--primary); transform: translateY(-2px); }
  .month-card .mc-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--ink); }
  .month-card .mc-persen { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="who">Halo, <span id="namaSiswa">-</span></div>
  <div class="topbar-actions">
    <button class="btn-topbar" onclick="showResetPasswordModal()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Ganti Password
    </button>
    <button class="btn-topbar btn-logout" onclick="doLogout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Keluar
    </button>
  </div>
</div>

<div class="tab-switcher">
  <button class="tab-btn active" onclick="switchTab('checkin')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
      <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
      <path d="M9 14h6"></path><path d="M9 18h6"></path><path d="M9 10h.01"></path>
    </svg> Check-in
  </button>
  <button class="tab-btn" onclick="switchTab('riwayat')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
    </svg> Riwayat
  </button>
</div>

<div id="view-checkin" class="stage">
  <div class="clock" id="clock">--:--:--</div>
  <div class="date-line" id="dateLine">-</div>

  <div class="mapel-grid" id="mapelGrid">
    <!-- diisi lewat JS: kartu TIK & KKA -->
  </div>
</div>

<div id="view-riwayat" class="stage-riwayat" style="display:none">
  <div class="filter-bar">
    <label>Bulan</label>
    <select id="riwayatBulan" onchange="handleFilterChange()"></select>
    <label>Tahun</label>
    <select id="riwayatTahun" onchange="handleFilterChange()"></select>
  </div>
  
  <div id="riwayatContent">
    <div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Memuat data...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="resetModal">
  <div class="modal-card">
    <h3>Ganti Password</h3>
    <input type="password" id="oldPass" placeholder="Password Lama" />
    <input type="password" id="newPass" placeholder="Password Baru (min 6 kar)" />
    <div class="modal-actions">
      <button class="modal-btn btn-cancel" onclick="hideResetPasswordModal()">Batal</button>
      <button class="modal-btn btn-save" onclick="doResetPassword()" id="btnSavePass">Simpan</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }

  const MAPEL = ['TIK', 'KKA'];
  let statusMap = { TIK: null, KKA: null };

  function tickClock() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    document.getElementById('clock').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][now.getDay()];
    const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][now.getMonth()];
    document.getElementById('dateLine').textContent = `${hari}, ${now.getDate()} ${bulan} ${now.getFullYear()}`;
  }
  setInterval(tickClock, 1000);
  tickClock();

  function renderMapelGrid() {
    const grid = document.getElementById('mapelGrid');
    grid.innerHTML = '';
    MAPEL.forEach((mapel) => {
      const done = statusMap[mapel];
      const card = document.createElement('div');
      card.className = 'mapel-card';
      card.innerHTML = `
        <div class="mapel-name">${mapel}</div>
        <button class="checkin-btn ${done ? 'done' : ''}" data-mapel="${mapel}" ${done ? 'disabled' : ''}>
          ${done ? '&#10003;' : 'Absen'}
        </button>
        <div class="mapel-status">${done ? 'Tercatat ' + done : 'Belum check-in'}</div>
      `;
      grid.appendChild(card);
    });
    grid.querySelectorAll('.checkin-btn:not(:disabled)').forEach((btn) => {
      btn.addEventListener('click', () => handleCheckin(btn.dataset.mapel, btn));
    });
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (type || '');
    setTimeout(() => { el.className = 'toast'; }, 3200);
  }

  async function handleCheckin(mapel, btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = '...';
    try {
      const res = await apiPost('checkin', { token: getToken(), mapel });
      if (res.ok) {
        statusMap[mapel] = res.waktu;
        renderMapelGrid();
        showToast(res.message, 'success');
        const newBtn = document.querySelector(`.checkin-btn[data-mapel="${mapel}"]`);
        if (newBtn) newBtn.classList.add('just-done');
      } else {
        showToast(res.error, 'error');
        btnEl.disabled = false;
        btnEl.textContent = 'Absen';
      }
    } catch (err) {
      showToast('Gagal terhubung ke server', 'error');
      btnEl.disabled = false;
      btnEl.textContent = 'Absen';
    }
  }

  async function loadStatus() {
    const res = await apiPost('getAbsensiHariIni', { token: getToken() });
    if (res.ok) {
      statusMap = res.status;
      renderMapelGrid();
    }
  }

  function showResetPasswordModal() {
    document.getElementById('oldPass').value = '';
    document.getElementById('newPass').value = '';
    document.getElementById('resetModal').classList.add('show');
  }

  function hideResetPasswordModal() {
    document.getElementById('resetModal').classList.remove('show');
  }

  async function doResetPassword() {
    const oldP = document.getElementById('oldPass').value;
    const newP = document.getElementById('newPass').value;
    if(!oldP || !newP) return showToast('Harap isi kedua password', 'error');
    if(newP.length < 6) return showToast('Password baru minimal 6 karakter', 'error');
    
    const btn = document.getElementById('btnSavePass');
    btn.disabled = true;
    btn.textContent = '...';
    try {
      const res = await apiPost('changeSiswaPassword', { token: getToken(), old_password: oldP, new_password: newP });
      if(res.ok) {
        showToast('Password berhasil diubah', 'success');
        hideResetPasswordModal();
      } else {
        showToast(res.error, 'error');
      }
    } catch(err) {
      showToast('Gagal terhubung ke server', 'error');
    }
    btn.disabled = false;
    btn.textContent = 'Simpan';
  }

  function doLogout() {
    apiPost('logout', { token: getToken() }).finally(() => {
      clearSession();
      window.location.href = 'index.html';
    });
  }

  const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

  let riwayatData = null;
  let currentRiwayatBulan = new Date().getMonth() + 1;
  let currentRiwayatTahun = new Date().getFullYear();

  function switchTab(tab) {
    document.getElementById('view-checkin').style.display = tab === 'checkin' ? '' : 'none';
    document.getElementById('view-riwayat').style.display = tab === 'riwayat' ? '' : 'none';
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'checkin') || (i === 1 && tab === 'riwayat'));
    });
    if (tab === 'riwayat') {
      initFilters();
      if (!riwayatData) loadRiwayat();
    }
  }

  function initFilters() {
    const selBulan = document.getElementById('riwayatBulan');
    const selTahun = document.getElementById('riwayatTahun');
    if (selBulan.options.length === 0) {
      NAMA_BULAN.forEach((b, i) => {
        const opt = document.createElement('option');
        opt.value = i + 1; opt.text = b;
        selBulan.appendChild(opt);
      });
      const yr = new Date().getFullYear();
      for (let i = yr - 2; i <= yr + 1; i++) {
        const opt = document.createElement('option');
        opt.value = i; opt.text = i;
        selTahun.appendChild(opt);
      }
    }
    selBulan.value = currentRiwayatBulan;
    selTahun.value = currentRiwayatTahun;
  }

  function handleFilterChange() {
    currentRiwayatBulan = parseInt(document.getElementById('riwayatBulan').value);
    currentRiwayatTahun = parseInt(document.getElementById('riwayatTahun').value);
    loadRiwayat();
  }

  async function loadRiwayat() {
    const content = document.getElementById('riwayatContent');
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">Memuat data...</div></div>';
    try {
      const res = await apiPost('getRiwayatSiswa', { token: getToken(), bulan: currentRiwayatBulan, tahun: currentRiwayatTahun });
      if (res.ok) {
        riwayatData = res;
        renderRiwayat();
      } else {
        content.innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-text">${res.error || 'Gagal memuat data'}</div></div>`;
      }
    } catch (err) {
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">Gagal terhubung ke server</div></div>';
    }
  }

  function getPersenClass(persen) {
    if (persen >= 80) return 'high';
    if (persen >= 60) return 'mid';
    return 'low';
  }

  function formatTanggal(dateStr) {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return `${NAMA_HARI[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`;
  }

  function selectMonth(bulan, tahun) {
    currentRiwayatBulan = bulan;
    currentRiwayatTahun = tahun;
    document.getElementById('riwayatBulan').value = bulan;
    document.getElementById('riwayatTahun').value = tahun;
    loadRiwayat();
  }

  function renderRiwayat() {
    const content = document.getElementById('riwayatContent');
    if (!riwayatData || !riwayatData.rekap_bulanan || riwayatData.rekap_bulanan.length === 0) {
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Belum ada data kehadiran pada bulan ini</div></div>';
      return;
    }
    
    // Cari rekap bulan terpilih; jika tidak ada data di bulan tsb, gunakan struktur default 0
    const rekap = riwayatData.rekap_bulanan.find(r => r.bulan == currentRiwayatBulan && r.tahun == currentRiwayatTahun) || {
      bulan: currentRiwayatBulan,
      tahun: currentRiwayatTahun,
      label: (NAMA_BULAN[currentRiwayatBulan - 1] || '') + ' ' + currentRiwayatTahun,
      persen_total: 0,
      total_hadir: 0,
      per_mapel: {
        TIK: { hadir: 0, izin: 0, sakit: 0, alfa: 0, total_hari: 0, persen: 0 },
        KKA: { hadir: 0, izin: 0, sakit: 0, alfa: 0, total_hari: 0, persen: 0 }
      }
    };

    const pClass = getPersenClass(rekap.persen_total);
    
    let html = `
      <div class="riwayat-header">
        <h2>${rekap.label || (NAMA_BULAN[rekap.bulan - 1] + ' ' + rekap.tahun)}</h2>
        <div class="overall-persen ${pClass}">${rekap.persen_total}%</div>
      </div>
    `;

    // Hitung total kehadiran berdasarkan detail rekap
    let tHadir = 0, tIzin = 0, tSakit = 0, tAlfa = 0;
    if (rekap.per_mapel) {
      Object.values(rekap.per_mapel).forEach(m => {
        tHadir += m.hadir || 0;
        tIzin += m.izin || 0;
        tSakit += m.sakit || 0;
        tAlfa += m.alfa || 0;
      });
    } else {
      // Fallback if we have summary variables
      tHadir = rekap.total_hadir || 0;
    }

    html += `
      <div class="rekap-stats">
        <div class="rekap-stat-card stat-hadir"><div class="stat-value">${tHadir}</div><div class="stat-label">Hadir</div></div>
        <div class="rekap-stat-card stat-izin"><div class="stat-value">${tIzin}</div><div class="stat-label">Izin</div></div>
        <div class="rekap-stat-card stat-sakit"><div class="stat-value">${tSakit}</div><div class="stat-label">Sakit</div></div>
        <div class="rekap-stat-card stat-alfa"><div class="stat-value">${tAlfa}</div><div class="stat-label">Alfa</div></div>
      </div>
    `;

    if (rekap.per_mapel) {
      html += `<div class="mapel-recap-grid">`;
      for (const [mName, mData] of Object.entries(rekap.per_mapel)) {
        const c = getPersenClass(mData.persen);
        html += `
          <div class="mapel-recap-card">
            <div class="mapel-title">${mName}</div>
            <div class="mapel-detail">
              <div><span style="color:var(--success)">${mData.hadir}</span>Hadir</div>
              <div><span style="color:var(--primary)">${mData.izin}</span>Izin</div>
              <div><span style="color:#f59e0b">${mData.sakit}</span>Sakit</div>
              <div><span style="color:var(--danger)">${mData.alfa}</span>Alfa</div>
            </div>
            <div class="progress-bar"><div class="progress-fill ${c}" style="width:${mData.persen}%"></div></div>
            <div class="persen-label ${c}">${mData.persen}%</div>
          </div>
        `;
      }
      html += `</div>`;
    }

    if (riwayatData.detail && riwayatData.detail.length > 0) {
      html += `<div class="table-wrap"><table class="rekap-table">
        <thead><tr><th>Tanggal</th><th>Mapel</th><th>Status</th><th>Waktu</th></tr></thead><tbody>`;
      riwayatData.detail.forEach(d => {
        const st = d.status.toLowerCase();
        const bClass = st === 'hadir' ? 'badge-hadir' :
                       st === 'izin' ? 'badge-izin' :
                       st === 'sakit' ? 'badge-sakit' : 'badge-alfa';
        html += `<tr>
          <td>${formatTanggal(d.tanggal)}</td>
          <td>${d.mapel}</td>
          <td><span class="badge ${bClass}">${d.status}</span></td>
          <td>${d.waktu || '-'}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    } else {
      html += `<div style="text-align:center; padding:24px; color:var(--ink-soft); font-size:13px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:20px;">Tidak ada rincian absensi harian pada bulan ${NAMA_BULAN[currentRiwayatBulan - 1]} ${currentRiwayatTahun}</div>`;
    }

    if (riwayatData.rekap_bulanan && riwayatData.rekap_bulanan.length > 1) {
      html += `<h3 style="font-size:14px; margin-bottom:12px; color:var(--ink); margin-top:32px;">Riwayat Bulan Lainnya</h3><div class="month-cards">`;
      riwayatData.rekap_bulanan.forEach(r => {
        if (r.bulan == currentRiwayatBulan && r.tahun == currentRiwayatTahun) return;
        const pc = getPersenClass(r.persen_total);
        html += `
          <div class="month-card" onclick="selectMonth(${r.bulan}, ${r.tahun})">
            <div class="mc-name">${r.label || (NAMA_BULAN[r.bulan-1] + ' ' + r.tahun)}</div>
            <div class="mc-persen ${pc}">${r.persen_total}%</div>
            <div class="progress-bar"><div class="progress-fill ${pc}" style="width:${r.persen_total}%"></div></div>
          </div>
        `;
      });
      html += `</div>`;
    }

    content.innerHTML = html;
  }

  (async function init() {
    const session = await guardPage('siswa');
    if (!session) return;
    document.getElementById('namaSiswa').textContent = getNama();
    await loadStatus();
  })();
</script>
</body>
</html>
